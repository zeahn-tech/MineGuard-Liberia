# =============================================================================
# PRODUCTION DEPLOYMENT — the ONE canonical path to the live site.
#
#   push / merge to main
#     -> CI gate        (reusable ci.yml: typecheck, lint, build, full test
#                        suite, RLS / migration / audit-hardening / rate-limit
#                        security suites — any failure stops the release)
#     -> production build (VITE_MINEGUARD_ENV=production, bundle checks)
#     -> GitHub Pages deployment
#     -> post-deploy verification (page, bundle, manifest answer 200)
#
# No backup step, no encryption passphrase, no typed confirmation and no manual
# approval are part of this pipeline. Database backups are an OPTIONAL,
# separate workflow (backup.yml) that cannot block or cancel a deployment.
#
# This workflow deploys the FRONTEND only. It never applies database
# migrations; those are a deliberate, separate step (docs/14_DEPLOYMENT_
# OPERATIONS.MD, "Database migrations").
#
# Requirements: Settings -> Pages -> Source = "GitHub Actions". Nothing else.
# =============================================================================

name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch: # authorised manual RE-run of main; deploys nothing else

permissions:
  contents: read

# One production deploy at a time; a newer push waits its turn (never cancels a
# deploy mid-flight, so Pages is never left half-published).
concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Production build
    needs: ci
    # Manual runs from any other branch validate but never publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build (production flags)
        # Production build: demo seeding compiled out of the UI.
        env:
          VITE_MINEGUARD_ENV: production
        run: bun run build

      - name: Production sanity — seed button absent, build complete
        run: |
          # The compiled bundle must not contain the demo-seed entry point
          # (doc 14 item 4, verified rather than promised).
          if grep -r "Load demo data" dist/assets/ >/dev/null 2>&1; then
            echo "FAIL: demo seed UI present in production bundle"; exit 1
          fi
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "manifest missing"; exit 1; }
          test -f dist/sw.js || { echo "sw.js missing"; exit 1; }
          test -d dist/icons || { echo "dist/icons missing"; exit 1; }
          REPO_BASE="/${GITHUB_REPOSITORY#*/}/"
          grep -q "src=\"${REPO_BASE}assets/" dist/index.html || {
            echo "FAIL: dist/index.html does not reference ${REPO_BASE}assets/"; exit 1;
          }
          if grep -q '/src/main.tsx' dist/index.html; then
            echo "FAIL: raw dev entry in built index.html"; exit 1
          fi
          grep -q "Content-Security-Policy" dist/index.html || {
            echo "FAIL: production CSP meta tag missing from dist/index.html"; exit 1;
          }

      - name: SPA fallback + nojekyll (Pages must not Jekyll-process the bundle)
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # actions/deploy-pages authenticates against the "github-pages" environment.
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (production)
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment answers
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL") || CODE=000
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          [ "$CODE" = "200" ] || { echo "FAIL: production endpoint did not answer 200 ($CODE)"; exit 1; }
          HTML=$(curl -s "$URL")
          echo "$HTML" | grep -q "/assets/index-" || {
            echo "FAIL: served page is not the built bundle (Pages source must be GitHub Actions)"; exit 1;
          }
          MANIFEST_CODE=$(curl -s -o /dev/null -w '%{http_code}' "${URL}manifest.webmanifest")
          [ "$MANIFEST_CODE" = "200" ] || { echo "FAIL: manifest.webmanifest -> $MANIFEST_CODE"; exit 1; }
          echo "Deploy verified: $URL"
