# =============================================================================
# PRODUCTION DEPLOYMENT (doc 14 — deploy path)
#
# The dev deployment (deploy-pages.yml on push to main) is the developer
# surface. This workflow is the PRODUCTION path and differs in the points
# doc 14 requires:
#
#   1. MANUAL GATE ONLY (workflow_dispatch with a required environment
#      selection) — production deploys are deliberate acts, never a side
#      effect of a push.
#   2. FORCED BACKUP FIRST — the deploy job waits for a fresh Supabase
#      backup (backup-supabase.sh) so no deploy ever proceeds on a stale
#      recovery point.
#   3. PRODUCTION BUILD — VITE_MINEGUARD_ENV=production: demo seeding is
#      compiled out of the UI and refused at the call site (doc 14 item 4).
#   4. DEPLOY VERIFICATION — the workflow fails if the SPA endpoint does
#      not answer, so a half-shipped deploy is visible, not silent.
#
# Prerequisites (documented in docs/14_DEPLOYMENT_OPERATIONS.MD):
#   - GitHub environment "production" created with required reviewers.
#   - Repository variables: SUPABASE_PROJECT_REF (production project ref),
#     SUPABASE_DB_HOST (session-pooler host; runners are IPv4-only) and
#     SUPABASE_DB_USER ("postgres.<project-ref>").
#   - Secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD (production).
#   - GitHub Pages source: GitHub Actions (same as dev deploy).
# =============================================================================

name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm_prod:
        description: 'Type "deploy-production" to confirm'
        required: true
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production # requires approval from configured reviewers
    outputs:
      backup_artifact: ${{ steps.backup.outputs.artifact }}
    steps:
      - name: Confirm typed gate
        env:
          CONFIRM: ${{ github.event.inputs.confirm_prod }}
        run: |
          if [ "$CONFIRM" != "deploy-production" ]; then
            echo "Refusing to deploy: confirmation phrase not typed exactly."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck + tests must be green before a prod deploy
        run: |
          bun run typecheck
          bun run test

      # pg_dump refuses to dump a server newer than itself; Supabase runs
      # PostgreSQL 17, while ubuntu-latest ships an older client by default.
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # Backup BEFORE build/deploy: doc 14 rule — never deploy without a
      # fresh recovery point. The backup script uploads nothing to third
      # parties; the dump is stored as a build artifact and (optionally)
      # synced to object storage by the operator.
      - name: Backup production database
        id: backup
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_HOST: ${{ vars.SUPABASE_DB_HOST }}
          SUPABASE_DB_USER: ${{ vars.SUPABASE_DB_USER }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          OUT="$(bash scripts/backup-supabase.sh ./backups)"
          echo "artifact=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload backup artifact (retain 90 days)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.artifact }}
          path: backups/
          retention-days: 90
          if-no-files-found: error

  build:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build (production flags)
        run: bun run build
        env:
          DISABLE_VLY_PLUGIN: "1"
          # Production build: demo seeding compiled out of the UI.
          VITE_MINEGUARD_ENV: production

      - name: Production sanity — seed button absent, build complete
        run: |
          # The compiled bundle must not contain the demo-seed entry point
          # (doc 14 item 4, verified rather than promised).
          if grep -r "Load demo data" dist/assets/ >/dev/null 2>&1; then
            echo "FAIL: demo seed UI present in production bundle"; exit 1
          fi
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "manifest missing"; exit 1; }
          test -f dist/sw.js || { echo "sw.js missing"; exit 1; }
          test -d dist/icons || { echo "dist/icons missing"; exit 1; }
          REPO_BASE="/${GITHUB_REPOSITORY#*/}/"
          grep -q "src=\"${REPO_BASE}assets/" dist/index.html || {
            echo "FAIL: dist/index.html does not reference ${REPO_BASE}assets/"; exit 1;
          }

      - name: SPA fallback + nojekyll (Pages must not Jekyll-process the bundle)
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # actions/deploy-pages authenticates against the "github-pages" environment;
  # running it inside the "production" environment fails the OIDC check. The
  # production approval gate already happened in the guard job above.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (production)
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment answers
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL") || CODE=000
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          [ "$CODE" = "200" ] || { echo "FAIL: production endpoint did not answer 200 ($CODE)"; exit 1; }
          HTML=$(curl -s "$URL")
          echo "$HTML" | grep -q "/assets/index-" || {
            echo "FAIL: served page is not the built bundle (Pages source must be GitHub Actions)"; exit 1;
          }
          MANIFEST_CODE=$(curl -s -o /dev/null -w '%{http_code}' "${URL}manifest.webmanifest")
          [ "$MANIFEST_CODE" = "200" ] || { echo "FAIL: manifest.webmanifest -> $MANIFEST_CODE"; exit 1; }
          echo "Deploy verified: $URL"
