name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
        env:
          # vlyPlugin is a Freebuff-platform plugin; disable it in CI.
          DISABLE_VLY_PLUGIN: "1"

      - name: SPA fallback (404 → index)
        run: cp dist/index.html dist/404.html

      # Fail the deploy loudly instead of shipping a broken artifact if the
      # build output is incomplete (missing manifest = broken PWA).
      - name: Sanity-check build output
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "dist/manifest.webmanifest missing"; exit 1; }
          test -f dist/sw.js || { echo "dist/sw.js missing"; exit 1; }
          test -d dist/icons || { echo "dist/icons missing"; exit 1; }
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
