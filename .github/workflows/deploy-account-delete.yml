
name: Deploy Supabase Account Delete Function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy account-delete
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate credentials and function
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "Missing SUPABASE_ACCESS_TOKEN"
            exit 1
          }

          test -n "$SUPABASE_PROJECT_ID" || {
            echo "Missing SUPABASE_PROJECT_ID"
            exit 1
          }

          test -d "supabase/functions/account-delete" || {
            echo "account-delete function folder not found"
            exit 1
          }

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

        - name: Deploy account-delete
        run: |
          supabase functions deploy account-delete \
            --remote="$SUPABASE_PROJECT_ID" \
            --use-api \
            --yes
      
