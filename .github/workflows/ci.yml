# Required status checks for pull requests into main, and the validation gate
# of the production deployment (called by deploy-production.yml).
# The job names below ("Validate", "rls-security-test") are the exact check
# names the branch ruleset waits for — renaming a job leaves the PR stuck on
# "Expected — Waiting for status to be reported".
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Reusable: deploy-production.yml calls this as its validation gate, so the
  # SAME checks that guard pull requests also guard every production release.
  # (No separate push-to-main trigger: that would run the suite twice per merge.)
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc -b --noEmit
      - name: Lint
        run: bunx eslint .
      - name: Build
        run: bunx vite build
      - name: Test (full suite)
        run: |
          echo "::notice title=runner::$(. /etc/os-release; echo "$PRETTY_NAME") | bun $(bun --version) | $(nproc) cpu | TZ=${TZ:-unset}"
          set +e
          bun test --timeout 60000 2>&1 | tee test.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # Surface WHICH tests failed (and what ran just before the first
            # tenant-guard error) as annotations, so a red run is diagnosable
            # without opening the raw log.
            grep -E '^\(fail\)' test.log | sort -u | head -30 | while IFS= read -r l; do echo "::warning title=failed test::$l"; done
            n=$(grep -n 'FORBIDDEN_TENANT_CHANGE' test.log | head -1 | cut -d: -f1)
            if [ -n "$n" ]; then
              ctx=$(sed -n "$(( n > 40 ? n - 40 : 1 )),$(( n + 2 ))p" test.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::warning title=context before first FORBIDDEN_TENANT_CHANGE::$ctx"
            fi
          fi
          exit $rc

  rls-security-test:
    name: rls-security-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: RLS / grants / audit-hardening regression suites
        run: >
          bun test --timeout 60000
          tests/rls.test.ts
          tests/migration-apply.test.ts
          tests/audit-hardening.test.ts
          tests/rate-limit.test.ts
